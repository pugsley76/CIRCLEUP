[package]
name = "circle"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.7.7" }

[dev-dependencies]
soroban-sdk  = { version = "21.7.7", features = ["testutils"] }
reputation   = { path = "../reputation", features = ["testutils"] }
proptest = "1.11.0"

[features]
testutils = ["soroban-sdk/testutils", "reputation/testutils"]
